<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>ঐন্দ্রি'র অন্নপ্রাশন</title>
<style>
  :root{
    --blush-1:#fbe6ee;
    --blush-2:#f7c9dc;
    --ink:#8a2453;
    --gold:#c9922f;
    --paper-edge:#fbe6ee;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #fff7fa 0%, #f6d9e6 45%, #eec2d7 100%);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
  }

  /* soft decorative floating dots */
  .bg-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .bg-deco span{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #ffffff, #f3b8d1 70%);
    opacity:.45;filter:blur(1px);
    animation:float 9s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-18px);}
  }

  .stage{
    position:relative;
    width:min(84vw, 460px);
    aspect-ratio: 800 / 1066;
    perspective: 2600px;
    z-index:1;
  }

  .book-shadow{
    position:absolute;
    left:6%; right:6%; bottom:-5%;
    height:22px;
    background:radial-gradient(ellipse at center, rgba(120,30,70,.35), rgba(120,30,70,0) 72%);
    filter:blur(4px);
    z-index:0;
  }

  /* Elegant cross-fade page transition: two layered images, gentle fade + soft lift */
  .viewport{
    position:absolute; inset:0;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 18px 45px -12px rgba(120,20,60,.45), 0 2px 8px rgba(120,20,60,.2);
    background:var(--paper-edge);
    z-index:1;
  }
  .slide-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    background:var(--paper-edge);
    opacity:0;
    transform: scale(1.015);
    transition: opacity .9s cubic-bezier(.45,0,.2,1), transform .9s cubic-bezier(.45,0,.2,1);
    z-index:1;
  }
  .slide-img.active{
    opacity:1;
    transform: scale(1);
    z-index:2;
  }
  .slide-img.leaving{
    opacity:0;
    transform: scale(.985);
    z-index:1;
    transition: opacity .75s cubic-bezier(.45,0,.2,1), transform .75s cubic-bezier(.45,0,.2,1);
  }

  /* Closed cover */
  .stage{ overflow:visible; }

  .cover-wrap{
    position:absolute; inset:0;
    z-index:10;
    transform-style:preserve-3d;
    transform-origin: 2% 50%;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transition: transform 1.15s cubic-bezier(.6,.05,.24,1), box-shadow 1.15s ease, opacity .35s ease .8s;
    cursor:pointer;
    border-radius:14px;
    box-shadow: 0 20px 50px -10px rgba(120,20,60,.5);
  }
  .cover-wrap img{
    width:100%;height:100%;object-fit:contain;
    border-radius:14px;
    background:var(--paper-edge);
    display:block;
  }
  .cover-wrap.opened{
    transform: rotateY(-165deg);
    box-shadow: 0 4px 20px -6px rgba(120,20,60,.25);
    pointer-events:none;
    opacity:0;
  }
  .cover-wrap.removed{
    display:none;
  }

  .tap-hint{
    position:absolute;
    left:50%; bottom:7%;
    transform:translateX(-50%);
    color:#fff;
    background:rgba(140,30,75,.75);
    padding:13px 26px;
    border-radius:999px;
    font-size:17px;
    font-weight:600;
    letter-spacing:.02em;
    backdrop-filter: blur(3px);
    animation: pulse 1.8s ease-in-out infinite;
    pointer-events:none;
    z-index:11;
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tap-hint .hand{ font-size:19px; }
  @keyframes pulse{
    0%,100%{opacity:.55; transform:translateX(-50%) translateY(0);}
    50%{opacity:1; transform:translateX(-50%) translateY(-4px);}
  }
  .tap-hint.hidden{
    animation:none;
    opacity:0 !important;
    transition:opacity .4s ease;
  }

  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:58px;height:58px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    box-shadow:0 6px 16px rgba(120,20,60,.35);
    font-size:26px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
    transition: opacity .3s ease, transform .2s ease;
  }
  .nav-btn:active{ transform:translateY(-50%) scale(.92); }
  .nav-next{ right:-70px; }
  .nav-prev{ left:-70px; }
  .nav-btn[disabled]{opacity:0; pointer-events:none;}

  @media (max-width:760px){
    .nav-next{ right:2px; }
    .nav-prev{ left:2px; }
    .nav-btn{ width:48px;height:48px; font-size:22px; background:rgba(255,255,255,.95);}
  }

  .page-dots{
    position:absolute;
    left:50%; bottom:-34px;
    transform:translateX(-50%);
    display:flex; gap:7px;
    z-index:20;
  }
  .page-dots span{
    width:7px;height:7px;border-radius:50%;
    background:#e2a9c4;
    transition:all .35s ease;
  }
  .page-dots span.active{
    background:var(--ink);
    width:20px;
    border-radius:5px;
  }

  .replay-btn{
    position:absolute;
    left:50%; bottom:-72px;
    transform:translateX(-50%);
    background:linear-gradient(135deg,#c9922f,#e0b25a);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    font-size:13.5px;
    letter-spacing:.03em;
    box-shadow:0 8px 18px rgba(180,120,20,.35);
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease .3s, transform .3s ease;
    z-index:20;
    white-space:nowrap;
  }
  .replay-btn.show{ opacity:1; pointer-events:auto; }

  .end-badge{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%) scale(.8);
    background:rgba(255,255,255,.92);
    color:var(--ink);
    padding:6px 16px;
    border-radius:999px;
    font-size:12px;
    letter-spacing:.08em;
    box-shadow:0 6px 14px rgba(120,20,60,.2);
    opacity:0;
    transition:opacity .6s ease .5s, transform .6s ease .5s;
    z-index:20;
    pointer-events:none;
  }
  .end-badge.show{ opacity:1; transform:translateX(-50%) scale(1); }

  /* Zoom button on the card */
  .zoom-btn{
    position:absolute;
    right:14px; bottom:14px;
    z-index:22;
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,.94);
    color:var(--ink);
    border:none;
    padding:10px 16px;
    border-radius:999px;
    font-size:15px;
    font-weight:600;
    box-shadow:0 6px 16px rgba(120,20,60,.35);
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .zoom-btn.show{ opacity:1; pointer-events:auto; }
  .zoom-btn .ico{ font-size:19px; }

  /* Full screen zoom lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(30,8,20,.92);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    touch-action:none;
    overflow:hidden;
  }
  .lightbox.show{ opacity:1; pointer-events:auto; }
  .lightbox-imgwrap{
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .lightbox-img{
    max-width:92vw;
    max-height:80vh;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    transform-origin:center center;
    touch-action:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .lightbox-close{
    position:absolute;
    top:16px; right:16px;
    width:52px;height:52px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.95);
    color:#8a2453;
    font-size:26px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
    z-index:110;
  }
  .lightbox-controls{
    position:absolute;
    left:50%; bottom:22px;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
    z-index:110;
  }
  .lightbox-controls button{
    width:56px;height:56px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.95);
    color:#8a2453;
    font-size:26px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-controls button:active{ transform:scale(.92); }
  .lightbox-hint{
    position:absolute;
    top:18px; left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:14px;
    background:rgba(255,255,255,.15);
    padding:8px 18px;
    border-radius:999px;
    z-index:110;
    white-space:nowrap;
  }

  @media (max-width:500px){
    .zoom-btn{ font-size:13px; padding:9px 13px; right:10px; bottom:10px;}
  }
</style>
</head>

<script>
(function(){
  // each image is embedded exactly once, in the hidden preload block; read it from there
  const pages = Array.from(document.querySelectorAll('.preload img'))
    .sort((a,b)=> +a.dataset.page - +b.dataset.page)
    .map(img => img.getAttribute('src'));

  let current = 0;      // index into pages currently shown
  let opened = false;
  let animating = false;

  const stage      = document.getElementById('stage');
  const coverWrap  = document.getElementById('coverWrap');
  const tapHint    = document.getElementById('tapHint');
  const imgA       = document.getElementById('imgA');
  const imgB       = document.getElementById('imgB');
  const nextBtn    = document.getElementById('nextBtn');
  const prevBtn    = document.getElementById('prevBtn');
  const dots       = document.querySelectorAll('#pageDots span');
  const replayBtn  = document.getElementById('replayBtn');
  const endBadge   = document.getElementById('endBadge');
  const zoomOpenBtn= document.getElementById('zoomOpenBtn');

  let activeLayer = imgA;   // the layer currently showing `current`
  let idleLayer   = imgB;   // the spare layer used for the next page
  activeLayer.src = pages[0];

  function updateDots(){
    dots.forEach((d,i)=>{
      d.classList.toggle('active', i === current);
    });
  }

  function updateNav(){
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    if(current === pages.length - 1){
      replayBtn.classList.add('show');
      endBadge.classList.add('show');
    } else {
      replayBtn.classList.remove('show');
      endBadge.classList.remove('show');
    }
  }

  coverWrap.addEventListener('click', openCover);

  function openCover(){
    if(opened) return;
    opened = true;
    tapHint.classList.add('hidden');
    coverWrap.classList.add('opened');
    setTimeout(()=>{
      updateDots();
      updateNav();
      zoomOpenBtn.classList.add('show');
    }, 200);
    // fully remove the cover from the layout once its swing-open + fade finishes
    setTimeout(()=>{ coverWrap.classList.add('removed'); }, 1200);
  }

  function goTo(targetIndex){
    if(!opened || animating) return;
    if(targetIndex < 0 || targetIndex > pages.length - 1) return;
    if(targetIndex === current) return;

    animating = true;
    current = targetIndex;

    idleLayer.src = pages[current];
    idleLayer.classList.remove('leaving');
    idleLayer.classList.add('active');
    activeLayer.classList.remove('active');
    activeLayer.classList.add('leaving');

    const finished = activeLayer;
    const temp = activeLayer;
    activeLayer = idleLayer;
    idleLayer = temp;

    setTimeout(()=>{
      finished.classList.remove('leaving');
      animating = false;
      updateDots();
      updateNav();
    }, 900);
  }

  nextBtn.addEventListener('click', ()=> goTo(current+1));
  prevBtn.addEventListener('click', ()=> goTo(current-1));

  // swipe support
  let touchStartX = null;
  stage.addEventListener('touchstart', e=>{
    touchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', e=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) goTo(current+1);
      else goTo(current-1);
    }
    touchStartX = null;
  }, {passive:true});

  replayBtn.addEventListener('click', ()=>{
    // reset everything back to the closed cover state
    opened = false;
    animating = false;
    current = 0;
    imgA.classList.remove('leaving');
    imgB.classList.remove('leaving');
    imgA.src = pages[0];
    imgA.classList.add('active');
    imgB.classList.remove('active');
    activeLayer = imgA;
    idleLayer = imgB;
    coverWrap.classList.remove('opened');
    coverWrap.classList.remove('removed');
    tapHint.classList.remove('hidden');
    zoomOpenBtn.classList.remove('show');
    updateDots();
    updateNav();
  });

  // ambient floating decoration dots
  const deco = document.getElementById('bgDeco');
  const decoCount = 10;
  for(let i=0;i<decoCount;i++){
    const s = document.createElement('span');
    const size = 4 + Math.random()*8;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (Math.random()*100)+'vh';
    s.style.animationDuration = (7+Math.random()*6)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    deco.appendChild(s);
  }

  updateDots();
  updateNav();

  // ---------------- Zoom lightbox (elder-friendly: buttons + pinch + drag) ----------------
  const lightbox      = document.getElementById('lightbox');
  const lightboxImg    = document.getElementById('lightboxImg');
  const lightboxClose  = document.getElementById('lightboxClose');
  const zoomInBtn      = document.getElementById('zoomInBtn');
  const zoomOutBtn     = document.getElementById('zoomOutBtn');
  const zoomResetBtn   = document.getElementById('zoomResetBtn');

  let scale = 1, panX = 0, panY = 0;
  let lastDist = null;
  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

  function applyTransform(){
    lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function resetZoom(){
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  }

  function clampScale(s){
    return Math.min(4, Math.max(1, s));
  }

  function openLightbox(){
    lightboxImg.src = pages[current];
    resetZoom();
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
  }

  zoomOpenBtn.addEventListener('click', openLightbox);
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e)=>{
    if(e.target === lightbox){ closeLightbox(); }
  });

  zoomInBtn.addEventListener('click', ()=>{ scale = clampScale(scale + 0.5); applyTransform(); });
  zoomOutBtn.addEventListener('click', ()=>{
    scale = clampScale(scale - 0.5);
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  });
  zoomResetBtn.addEventListener('click', resetZoom);

  // mouse wheel zoom (desktop)
  lightbox.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.25 : 0.25;
    scale = clampScale(scale + delta);
    if(scale === 1){ panX = 0; panY = 0; }
    applyTransform();
  }, {passive:false});

  // double-click / double-tap to toggle zoom
  let lastTapTime = 0;
  function handleDoubleTap(){
    const now = Date.now();
    if(now - lastTapTime < 320){
      scale = scale > 1 ? 1 : 2.2;
      if(scale === 1){ panX = 0; panY = 0; }
      applyTransform();
    }
    lastTapTime = now;
  }
  lightboxImg.addEventListener('click', handleDoubleTap);

  // mouse drag pan (desktop)
  lightboxImg.addEventListener('mousedown', (e)=>{
    if(scale <= 1) return;
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = panX; panStartY = panY;
  });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    applyTransform();
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; });

  // touch: pinch-to-zoom + single-finger pan
  function touchDist(t1, t2){
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }

  lightboxImg.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      lastDist = touchDist(e.touches[0], e.touches[1]);
    } else if(e.touches.length === 1 && scale > 1){
      dragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = panX; panStartY = panY;
    }
  }, {passive:true});

  lightboxImg.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2){
      e.preventDefault();
      const d = touchDist(e.touches[0], e.touches[1]);
      if(lastDist){
        const delta = (d - lastDist) * 0.012;
        scale = clampScale(scale + delta);
        applyTransform();
      }
      lastDist = d;
    } else if(e.touches.length === 1 && dragging){
      panX = panStartX + (e.touches[0].clientX - dragStartX);
      panY = panStartY + (e.touches[0].clientY - dragStartY);
      applyTransform();
    }
  }, {passive:false});

  lightboxImg.addEventListener('touchend', (e)=>{
    if(e.touches.length < 2) lastDist = null;
    if(e.touches.length === 0) dragging = false;
  }, {passive:true});

  // keyboard escape to close, arrow keys to navigate (nice-to-have for desktop)
  window.addEventListener('keydown', (e)=>{
    if(lightbox.classList.contains('show')){
      if(e.key === 'Escape') closeLightbox();
      return;
    }
    if(e.key === 'ArrowRight') goTo(current+1);
    if(e.key === 'ArrowLeft') goTo(current-1);
  });
})();
</script>
</body>
</html>
